<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ordinalzahlen 1–30 · Las Chapas ECOS</title>
<style>
:root{--navy:#0c4a85;--red:#c9414b;--ink:#3b3b3b;--bg:#f4f6fa;--card:#fff;--line:#dde3ec;--ok:#2e8b57;--soft:#e8eff8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--navy:#5b9bdc;--red:#e8737c;--ink:#e6e9ef;--bg:#12161d;--card:#1b212b;--line:#2c3542;--ok:#4cc38a;--soft:#222c3a}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif}
.wrap{max-width:900px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:16px;padding:14px 18px;border-bottom:4px solid var(--red);box-shadow:0 2px 10px rgba(12,74,133,.12)}
header img{height:64px;width:64px;border-radius:50%;background:#fff;object-fit:contain}
header h1{margin:0;font-size:1.35rem;color:var(--navy);letter-spacing:.5px}
header p{margin:2px 0 0;font:0.9rem system-ui,sans-serif;opacity:.75}
nav{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
nav button{flex:1;min-width:110px;padding:12px;border:2px solid var(--navy);background:transparent;color:var(--navy);border-radius:12px;font:600 .95rem system-ui,sans-serif;cursor:pointer}
nav button.on{background:var(--navy);color:#fff}
.rule{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:16px;font:.9rem system-ui,sans-serif}
.rule div{background:var(--soft);border-left:5px solid var(--navy);border-radius:10px;padding:10px 12px}
.rule div.r{border-color:var(--red)}
.rule b{color:var(--navy)}.rule .r b{color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.fc{perspective:700px;height:90px;cursor:pointer;border:0;background:none;padding:0}
.in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.f,.b{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px}
.f{background:var(--card);border:2px solid var(--line);border-top:5px solid var(--navy);font-size:2rem;font-weight:bold;color:var(--navy)}
.fc.irr .f{border-top-color:var(--red)}
.b{background:var(--navy);color:#fff;transform:rotateY(180deg);font:600 1rem system-ui,sans-serif;word-break:break-word}
.fc.irr .b{background:var(--red)}
.panel{background:var(--card);border-radius:16px;padding:22px;text-align:center;box-shadow:0 2px 10px rgba(12,74,133,.1)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--red));width:0;transition:width .3s}
.stats{display:flex;justify-content:space-between;font:600 .9rem system-ui,sans-serif;margin-bottom:12px}
.q{font-size:3.2rem;font-weight:bold;color:var(--navy);margin:10px 0 4px}
.sub{font:.95rem system-ui,sans-serif;opacity:.7;margin-bottom:16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button,.go{padding:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:600 1.05rem system-ui,sans-serif;cursor:pointer}
.opts button:hover:not(:disabled){border-color:var(--navy)}
.opts button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opts button.no{background:var(--red);border-color:var(--red);color:#fff}
.go{background:var(--navy);color:#fff;border-color:var(--navy);margin-top:14px}
input{width:100%;max-width:340px;padding:14px;font:1.2rem system-ui,sans-serif;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);text-align:center}
input:focus{outline:none;border-color:var(--navy)}
.fb{min-height:1.6em;margin-top:12px;font:600 1rem system-ui,sans-serif}
.fb.ok{color:var(--ok)}.fb.no{color:var(--red)}
.big{font-size:3rem;margin:6px 0}
.tip{font:.85rem system-ui,sans-serif;opacity:.7;text-align:center;margin-top:14px}
footer{text-align:center;font:.8rem system-ui,sans-serif;opacity:.6;margin:22px 0 8px}
@media(max-width:480px){.opts{grid-template-columns:1fr}.q{font-size:2.6rem}}
</style>
</head>

</header>

<script>
const W=["","erste","zweite","dritte","vierte","fünfte","sechste","siebte","achte","neunte","zehnte","elfte","zwölfte","dreizehnte","vierzehnte","fünfzehnte","sechzehnte","siebzehnte","achtzehnte","neunzehnte","zwanzigste","einundzwanzigste","zweiundzwanzigste","dreiundzwanzigste","vierundzwanzigste","fünfundzwanzigste","sechsundzwanzigste","siebenundzwanzigste","achtundzwanzigste","neunundzwanzigste","dreißigste"];
const IRR=[1,3,7,8,30];
const app=document.getElementById('app');
const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
let AC;
function ding(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();[523.25,659.25,783.99,1046.5].forEach((f,k)=>{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+k*.09;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.45);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.5)})}catch(e){}}
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const norm=s=>s.toLowerCase().trim().replace(/ß/g,'ss').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/\s+/g,'');

document.getElementById('nav').onclick=e=>{
 const b=e.target.closest('button');if(!b)return;
 document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
 ({learn,quiz:startQuiz,write:startWrite,date:startDate})[b.dataset.m]();
};

function learn(){
 let h=`<div class="rule">
 <div><b>1.–19.</b><br>Número + <b>-te</b><br>vier → vier<b>te</b></div>
 <div><b>20.–30.</b><br>Número + <b>-ste</b><br>zwanzig → zwanzig<b>ste</b></div>
 <div class="r"><b>¡Irregulares!</b><br>1. erste · 3. dritte<br>7. siebte · 8. achte</div></div>
 <div class="grid">`;
 for(let i=1;i<=30;i++)h+=`<button class="fc ${IRR.includes(i)?'irr':''}" data-n="${i}"><div class="in"><div class="f">${i}.</div><div class="b">der ${W[i]}</div></div></button>`;
 h+=`</div><p class="tip">Toca una tarjeta para girarla y escuchar la pronunciación 🔊. Las tarjetas rojas son irregulares.</p>`;
 app.innerHTML=h;
 app.querySelector('.grid').onclick=e=>{const c=e.target.closest('.fc');if(!c)return;c.classList.toggle('flip');if(c.classList.contains('flip'))say(W[+c.dataset.n])};
}

let S;
function head(){return `<div class="bar"><i style="width:${S.i/S.total*100}%"></i></div><div class="stats"><span>Pregunta ${Math.min(S.i+1,S.total)}/${S.total}</span><span>✅ ${S.score}</span><span>🔥 Racha ${S.streak}</span></div>`}
function end(){
 const p=Math.round(S.score/S.total*100);
 app.innerHTML=`<div class="panel"><div class="big">${p>=80?'🏆':p>=50?'👏':'💪'}</div><h2 style="color:var(--navy);margin:0">${S.score} / ${S.total}</h2><p class="sub">${p>=80?'¡Ausgezeichnet!':p>=50?'¡Gut gemacht!':'¡Sigue practicando!'}</p><button class="go" id="again">Jugar otra vez</button></div>`;
 $('#again').onclick=({quiz:startQuiz,write:startWrite,date:startDate})[S.mode];
}
function startQuiz(){S={mode:'quiz',i:0,total:10,score:0,streak:0};quizQ()}
function quizQ(){
 if(S.i>=S.total)return end();
 const n=1+rnd(30),rev=Math.random()<.5;
 let set=new Set([n]);while(set.size<4)set.add(1+rnd(30));
 const o=[...set].sort(()=>Math.random()-.5);
 app.innerHTML=`<div class="panel">${head()}<div class="q">${rev?'der '+W[n]:n+'.'}</div><div class="sub">${rev?'¿Qué número es?':'¿Cómo se dice en alemán?'}</div><div class="opts">${o.map(x=>`<button data-n="${x}">${rev?x+'.':'der '+W[x]}</button>`).join('')}</div><div class="fb"></div></div>`;
 $('.opts').onclick=e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;
  const ok=+b.dataset.n===n;
  document.querySelectorAll('.opts button').forEach(x=>{x.disabled=true;if(+x.dataset.n===n)x.classList.add('ok')});
  if(!ok)b.classList.add('no');else ding();
  S.score+=ok;S.streak=ok?S.streak+1:0;say(W[n]);
  $('.fb').className='fb '+(ok?'ok':'no');$('.fb').textContent=ok?'¡Richtig!':`Correcto: ${n}. = der ${W[n]}`;
  S.i++;setTimeout(quizQ,1400);
 };
}
function startWrite(){S={mode:'write',i:0,total:10,score:0,streak:0};writeQ()}
function writeQ(){
 if(S.i>=S.total)return end();
 const n=1+rnd(30);
 app.innerHTML=`<div class="panel">${head()}<div class="q">${n}.</div><div class="sub">Escribe el ordinal en alemán (ß = ss, ü = ue)</div><input id="in" autocomplete="off" autocapitalize="off" placeholder="der …"><br><button class="go" id="chk">Comprobar</button><div class="fb"></div></div>`;
 const inp=$('#in');inp.focus();
 const check=()=>{
  if(inp.disabled)return;
  const v=norm(inp.value.replace(/^der\s+/i,'')),ok=v===norm(W[n]);
  inp.disabled=true;if(ok)ding();S.score+=ok;S.streak=ok?S.streak+1:0;say(W[n]);
  $('.fb').className='fb '+(ok?'ok':'no');$('.fb').textContent=ok?'¡Richtig! 🎉':`Correcto: der ${W[n]}`;
  S.i++;setTimeout(writeQ,1700);
 };
 $('#chk').onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()};
}
const MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const cap=s=>s[0].toUpperCase()+s.slice(1);
const DT=[m=>`Ich habe ___ ${m} Geburtstag.`,m=>`Wir fliegen ___ ${m} nach Berlin.`,m=>`Der Deutschkurs beginnt ___ ${m}.`,m=>`Die Prüfung ist ___ ${m}.`];
const PT=[x=>`${x} ist im Rennen ___.`,x=>`${x} ist beim Wettbewerb ___.`,x=>`Im Test ist ${x} ___.`];
const NM=[['Ben','m'],['Max','m'],['Lena','f'],['Anna','f']];
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DTE=[(n,m)=>`Mi cumpleaños es el ${n} de ${m}.`,(n,m)=>`Volamos a Berlín el ${n} de ${m}.`,(n,m)=>`El curso de alemán empieza el ${n} de ${m}.`,(n,m)=>`El examen es el ${n} de ${m}.`];
const PTE=[(x,n,g)=>`${x} es ${g==='f'?'la '+n+'.ª':'el '+n+'.º'} en la carrera.`,(x,n,g)=>`${x} queda ${g==='f'?'la '+n+'.ª':'el '+n+'.º'} en la competición.`,(x,n,g)=>`En el examen, ${x} es ${g==='f'?'la '+n+'.ª':'el '+n+'.º'} de la clase.`];
function startDate(){S={mode:'date',i:0,total:12,score:0,streak:0};dateQ()}
function dateQ(){
 if(S.i>=S.total)return end();
 const n=1+rnd(30),isD=Math.random()<.5,nm=NM[rnd(4)];
 const dF='am '+W[n]+'n',pF=(isD||nm[1]==='m'?'der ':'die ')+cap(W[n]);
 const mi=rnd(12),di=rnd(DT.length),pi=rnd(PT.length);
 const txt=isD?DT[di](MON[mi]):PT[pi](nm[0]);
 const es=isD?DTE[di](n,MES[mi]):PTE[pi](nm[0],n,nm[1]);
 const right=isD?dF:pF,o=[dF,pF].sort(()=>Math.random()-.5);
 app.innerHTML=`<div class='panel'>${head()}<div class='rule'><div><b>📅 Fecha</b><br>am + ordinal + <b>-n</b><br>am siebten Mai</div><div class='r'><b>🏅 Posición</b><br>der/die + ordinal<br>der Siebte</div></div><div class='q'>${n}.</div><div class='sub' style='font-size:1.25rem;opacity:1'>${txt.replace('___',"<b style='color:var(--red)'>_____</b>")}</div><div class='sub' style='font-size:1rem;margin-top:-8px'>🇪🇸 ${es}</div><div class='opts'>${o.map(x=>`<button data-v='${x}'>${x}</button>`).join('')}</div><div class='fb'></div></div>`;
 $('.opts').onclick=e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;
  const ok=b.dataset.v===right;
  document.querySelectorAll('.opts button').forEach(x=>{x.disabled=true;if(x.dataset.v===right)x.classList.add('ok')});
  if(!ok)b.classList.add('no');else ding();
  S.score+=ok;S.streak=ok?S.streak+1:0;
